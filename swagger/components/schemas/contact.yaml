#swagger/components/schemas/contact.yaml

type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's ID"
    type: string
    example: '65e4decdd286b30065d54af9'
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380971234567'
  email:
    description: "Contact's email"
    type: string
    example: 'johndoe@email.com'
  isFavourite:
    description: 'Is contact favorite?'
    type: boolean
    example: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'work'
  photo:
    description: "URL to contact's photo"
    type: string
    example: 'https://example.com/photo.jpg'
