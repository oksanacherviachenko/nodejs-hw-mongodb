#swagger/paths/contacts/get.yaml
tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: Retrieve a list of contacts with filters, sorting, and pagination
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number for pagination
    required: false
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    description: Sort contacts by field
    required: false
    schema:
      type: string
      enum:
        - _id
        - name
        - email
        - phoneNumber
        - isFavourite
        - contactType
        - createdAt
        - updatedAt
      default: name
  - in: query
    name: sortOrder
    description: Sorting order
    required: false
    schema:
      type: string
      enum:
        - asc
        - desc
      default: asc
  - in: query
    name: filter
    description: Filter contacts by type
    required: false
    schema:
      type: string
      enum:
        - work
        - home
        - personal
      default: work
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contacts fetched successfully'
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    description: Contacts not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'No contacts found'
            data:
              type: object
              example: {}
